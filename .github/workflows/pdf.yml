name: ShenzhenPDF
# Started by hand only: every test runs locally through tools/release.sh (docs/RELEASING.md).
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pdf-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    working-directory: apps/pdf/portable
jobs:
  mac:
    # The macOS the suites are written and run on (fonts, AppKit drawing and SQLite as on the owner's Mac).
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Every header and source the builds name is committed
        run: ../../../tools/check-pdf-missing-files.py
      - name: Tools the tests use (qpdf for the password fixtures, GTK through pkg-config for the GTK4 and containment checks)
        run: brew install qpdf pkgconf gtk4 libadwaita json-glib
      - run: make -j"$(sysctl -n hw.ncpu)" mac-app
      - run: make -j"$(sysctl -n hw.ncpu)" test-binaries
      # The full suites run locally before each release (tools/release.sh); CI runs the build and the unit suites only.
      - name: Unit suites
        run: |
          . release/release-common.sh
          friends=$(printf 'ci-friends-checks:\n\t@echo $(FRIENDS_TEST_TARGETS)\n' |
            make -s --no-print-directory -f Makefile -f - ci-friends-checks | tr ' ' '\n' |
            grep -v -x -e 'friends-gtk.*-check' -e 'friends-e2e.*-check' -e friends-nat-emulator-check)
          suites="$friends mac-friends-host-adapter-tests $(spdf_discover_test_targets Makefile | grep -v -x \
            -e friends-tests -e mac-ai-python-tests -e mac-launch-performance-tests -e mac-page-load-tests \
            -e mac-quit-performance-tests -e mac-quit-integrity-tests)"
          make -k -j"$(sysctl -n hw.ncpu)" $suites 2>&1 | tee build/ci-unit-suites.log
          if [ "${PIPESTATUS[0]}" != 0 ]; then
            # A few checks time themselves in 100 ms windows, which side-by-side suites can miss: what failed runs again
            # alone, as the release runs every suite, and fails the step only if it fails there too.
            again=$(sed -nE -e 's/^make: \*\*\* \[([^]]+)\] Error.*/\1/p' \
              -e "s/^make: Target .([^']+)' not remade because of errors\./\1/p" build/ci-unit-suites.log | sort -u)
            echo "Running again, one at a time: $again"
            make -k $again
          fi
