[package]
name = "shenzhen-3d"
version = "0.2.1"
description = "Local-first CAD and mesh viewer"
authors = ["Shenzhen 3D contributors"]
license = "GPL-3.0-or-later"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[features]
# Shenzhen Friends (docs/FRIENDS.md § Tauri): the pinned tauri-plugin-szfriends, its window.shenzhenFriends for the
# main window, and the helper it connects to. Build with node scripts/platform-build.mjs desktop --friends.
# Friends links (shenzhen3d://friends/link#…, src/friends_links.rs): on Windows and Linux a second launch hands its
# link or files to the running app; Android delivers them through tauri-plugin-deep-link.
friends = ["dep:tauri-plugin-szfriends", "dep:tauri-plugin-deep-link", "dep:tauri-plugin-single-instance"]
# Test builds only: the Friends smoke drives the page from a script of its own (scripts/friends/tauri-smoke.mjs),
# against helpers in Friends homes of their own, which only such a build (or a debug one) may name.
friends-smoke = ["friends", "tauri-plugin-szfriends/test-homes"]
# Phones: Friends over the Internet in the app's own process (the host connection and the data-channel stack), so
# a phone reaches friends anywhere and makes and opens links. Desktops reach the helper, which has it already.
# platform-build.mjs turns it on for Friends phone builds.
friends-online = ["friends", "tauri-plugin-szfriends/online"]
# Test builds only: the Windows, Linux and iOS updater reads its releases from the local copy of GitHub that
# SHENZHEN_3D_UPDATES_API names (scripts/updates/mock-github.mjs), with src-tauri/updates-test.conf.json, which lets
# Tauri's updater use that copy's plain-HTTP address. Release builds always read GitHub.
updates-test-api = []

[dependencies]
# Resolved through ../.cargo/config.toml: a placeholder unless a Friends build points it at the pinned plugin.
tauri-plugin-szfriends = { version = "0.1.0", registry = "szfriends-pinned", optional = true }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = [] }

tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-deep-link = { version = "2.6", optional = true }

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2.5", optional = true }
# Updates on Windows and Linux (docs/UPDATES.md § Windows and Linux): signed installers listed in each release's
# latest.json. Pinned: its signature checks and installer handling are part of every published release.
tauri-plugin-updater = "=2.13.3"
# The app's own check of each downloaded installer (src/release_feed.rs): its signature, as Tauri's updater checks
# it, and its line in the release's SHA256SUMS.txt.
base64 = "0.22"
minisign-verify = "0.3"
sha2 = "0.10"

# The releases check of the Windows, Linux and iOS updater (src/app_updates.rs): the reqwest and rustls Tauri's
# updater uses.
[target.'cfg(any(windows, target_os = "linux", target_os = "ios"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["time"] }

# Whether the connection is metered, before a daily check.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Networking_Connectivity"] }

# Opening iOS's installer for an update (an itms-services link).
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSDictionary"] }
objc2-ui-kit = { version = "0.3", features = ["UIApplication", "UIResponder", "block2"] }

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.3"
sha2 = "0.10"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
tauri-plugin-log = "2"
