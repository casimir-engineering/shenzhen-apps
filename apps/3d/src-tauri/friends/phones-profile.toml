# Shenzhen Friends on phones: its crates built for size against ADR 0015 § 12 (opt-level "z", one codegen unit;
# 3 for the ciphers and hashes, which carry every transferred byte: ADR 0018 § 9.2, as the core's own Cargo.toml has
# it, with the arm64 SIMD backends that the core's phone.toml switches on), without changing how the viewer's own crates
# are optimised. The online part (szfriends-online, the data channels' C and C++, which szfriends-datachannel-sys
# compiles at -Oz for phones by itself) is built the same way. A cargo --config file, passed by
# scripts/platform-build.mjs for Friends phone builds and by scripts/friends/phones-size.sh. The whole library is
# linked with thin LTO in one codegen unit, so code the viewer and Friends share is not carried twice.

[profile.release]
lto = "thin"
codegen-units = 1

[profile.release.package.tauri-plugin-szfriends]
opt-level = "z"
codegen-units = 1

[profile.release.package.szfriends-helper]
opt-level = "z"
codegen-units = 1

