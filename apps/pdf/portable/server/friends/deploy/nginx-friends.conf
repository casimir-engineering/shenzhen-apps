# friends.meerkat.orgabots.com -> the `friends` container on the edge network.
#
# Append to /opt/stacks/ingress/data/nginx/custom/http.conf beside the existing hand-written blocks (split,
# paiban), copy their `listen` and `ssl_certificate` lines (the wildcard certificate already covers this name),
# run `nginx -t`, then reload. Reload the ingress again after recreating the friends container.

server {
    # Use the same listen and certificate lines as the neighbouring blocks in http.conf.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name friends.meerkat.orgabots.com;
    # ssl_certificate     <the wildcard certificate the other blocks use>;
    # ssl_certificate_key <its key>;

    # ADR 0005 § Privacy: no client address in any log. nginx writes "client: <address>" into error lines, even at
    # crit, so this block writes none. TLS handshakes that fail before SNI are logged by the listener's default
    # server, not here; DEPLOY.md says how to check it.
    access_log off;
    error_log /dev/null;

    # Docker's embedded DNS, re-resolved at request time through a variable, so a recreated container (new IP)
    # does not leave nginx proxying to a dead address and answering 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $friends_upstream http://friends:8080;

    # The WebSocket endpoint. Besides it only the link pages below: the dashboard is on a Unix socket and /healthz
    # stays internal.
    location = /v1 {
        proxy_pass $friends_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Used only as a key of the service's in-memory limits, and believed only because this ingress's address is
        # FRIENDS_TRUSTED_PROXY; never stored.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        # Connections stay open while ShenzhenPDF runs. Both sides ping every 25 s, so 120 s of silence means the
        # peer is gone.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # The link pages (src/link-pages.js, LINK_PAGE_PATHS), each by its exact path, so nothing else under / reaches
    # the service. The service sets every security header itself (CSP, frame-ancestors, no-referrer, nosniff, ETag);
    # nginx passes them through unchanged, so this block adds none. Same request headers as /v1.

    # The friend link page.
    location = /f {
        proxy_pass $friends_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 10s;
    }

    # The download link page.
    location = /d {
        proxy_pass $friends_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 10s;
    }

    # The download page's service worker.
    location = /d/sw.js {
        proxy_pass $friends_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 10s;
    }

    # The pages' stylesheet.
    location = /links/links.css {
        proxy_pass $friends_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 10s;
    }

    # The pages' one script.
    location = /links/links.js {
        proxy_pass $friends_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_connect_timeout 10s;
    }

    location / {
        return 404;
    }
}
