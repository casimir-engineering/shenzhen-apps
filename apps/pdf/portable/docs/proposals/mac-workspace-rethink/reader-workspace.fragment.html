      case 'keep':state.kept=state.kept.includes(state.version)?state.kept.filter(x=>x!==state.version):[...state.kept,state.version];render();persist();break;
      case 'version-info':if(state.missing)overlay(dialog('Original document missing','<p>Your saved copy remains available to read.</p><button data-action="locate">Find document…</button><button data-action="save-copy">Save new copy as…</button>'));else{state.mode='history';state.pane=true;render();}break;
      case 'version-menu':overlay(dialog('Version actions','<div class="sz-chooser"><button data-action="compare-previous">Compare with Previous</button><button data-action="save-copy">Save a Copy…</button><button data-action="reveal">Show in Explorer</button><button data-action="collection">Manage Collection…</button></div>'));break;
      case 'locate':overlay(dialog('Find original document','<p>Search this Mac for files with the same content hash, or locate the original manually.</p><button data-action="auto-find">Search this Mac</button><button data-action="manual-find">Choose file…</button>'));break;
      case 'auto-find':case 'manual-find':closeOverlay();notice('File recovery is represented here; this prototype does not search your Mac.');break;
      case 'compare-previous':closeOverlay();notice('Compare with Previous keeps the same two-document layout.');break;
      case 'dismiss':closeOverlay();break;
      default:closeOverlay();notice('Native action location shown; no document or settings are changed by this prototype.');break;
    }
  });
  root.addEventListener('input',e=>{const kind=e.target.dataset.input;if(!kind)return;const value=e.target.value;
    if(kind==='groups'){state.groupQuery=value;q('.sz-list').innerHTML=groupList();}
    if(kind==='find'){state.query=value;q('.sz-results').innerHTML=searchResults();q('.sz-count').textContent=value?(matchingText()===null?'Invalid pattern':`${matchingText().length} matches`):'Enter a search term';renderDocument();root.querySelectorAll('.sz-map-pages button').forEach(b=>b.classList.toggle('sz-map-hit',(matchingText()||[]).some(x=>x.i*3+1===Number(b.dataset.page))));}
    if(kind==='chapters'){state.filter=value;const temp=document.createElement('div');temp.innerHTML=panel();q('.sz-list').innerHTML=temp.querySelector('.sz-list').innerHTML;}
    if(kind==='comments'){q('.sz-list').querySelectorAll('button').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(value.toLowerCase()));}
    if(kind==='collection')q('.sz-collection-results').innerHTML=collectionRows(value);
    if(kind==='command')q('.sz-command-results').innerHTML=commandRows(value);symbols();if(['find','groups','chapters','comments'].includes(kind))persist();
  });
  root.addEventListener('change',e=>{if(e.target.matches('[data-regex]')){state.regex=e.target.checked;render();persist();}if(e.target.matches('[data-linked]'))state.linked=e.target.checked;if(e.target.matches('.sz-page-number')){state.page=Math.max(1,Math.min(20,Number(e.target.value)||1));render();persist();}if(e.target.matches('.sz-zoom')){state.zoom=e.target.value;renderDocument();persist();}});
  root.addEventListener('keydown',e=>{
    if(e.key==='Escape'&&!q('.sz-group-picker').hidden){q('.sz-group-picker').hidden=true;q('.sz-tab-more').setAttribute('aria-expanded','false');q('.sz-tab-more').focus();return;}
    if(!q('.sz-overlay').hidden){if(e.key==='Escape'){e.preventDefault();closeOverlay();return;}if(e.key==='Tab'){const items=[...q('.sz-overlay').querySelectorAll('button,input,select,a')].filter(x=>!x.disabled&&x.getClientRects().length),first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}if(e.key==='Enter'&&e.target.matches('[data-input=command]')){q('.sz-command-result')?.click();}return;}
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();q('[data-action=command]').click();}
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='f'){e.preventDefault();state.mode='find';state.pane=true;render();q('[data-input=find]').focus();}
    if((e.key==='Enter'&&e.target.matches('[data-input=find]'))||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='g')){e.preventDefault();const hits=matchingText()||[];if(hits.length){let current=hits.findIndex(x=>x.i*3+1===state.page);current=(current+(e.shiftKey?-1:1)+hits.length)%hits.length;state.page=hits[current].i*3+1;render();q('[data-input=find]')?.focus();persist();}}
  });
  window.addEventListener('openai:set_globals',e=>{const incoming=e.detail?.globals?.widgetState?.modelContent;if(incoming){Object.assign(state,e.detail.globals.widgetState.privateContent||{},incoming);render();}});
  render();
  let measuredWidth=root.clientWidth;
  new ResizeObserver(()=>{const width=root.clientWidth;if(width!==measuredWidth){measuredWidth=width;render();}}).observe(root);
  if(globalThis.Tweak){let appliedCondition=design.condition;const tweak=new Tweak({container:root,onChange:()=>{if(design.condition!==appliedCondition){state.missing=design.condition==='Original missing';state.version=design.condition==='Older version'?'2026.09.24':'latest';appliedCondition=design.condition;}render();persist();}});tweak.addSlider(design,'height',{label:'Reader content height',min:296,max:650,step:1,unit:'px'});tweak.addSelect(design,'condition',{label:'Document condition',options:['Linked original','Older version','Original missing']});}
})();
</script>
