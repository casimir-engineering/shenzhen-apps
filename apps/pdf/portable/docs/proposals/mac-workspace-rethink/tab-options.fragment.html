<script>
(()=>{
  const root=document.getElementById('sz-tab-options');
  const state={selected:{},collapsed:{},closed:{},...(window.openai?.widgetState?.privateContent||{})};
  const icon=n=>`<i data-lucide="${n}" aria-hidden="true"></i>`;
  function draw(){root.querySelectorAll('.sample').forEach(sample=>{
    const id=sample.dataset.tabDesign, selected=state.selected[id]||0,collapsed=!!state.collapsed[id];
    sample.innerHTML=`<div class="sz-window"><header class="sz-titlebar"><span class="sz-lights" aria-hidden="true"><b></b><b></b><b></b></span><div class="sz-tabs"><div class="sz-browser-group ${collapsed?'is-collapsed':'is-expanded'} is-current-group" data-color="hardware"><button class="sz-group-label" data-group="${id}" aria-expanded="${!collapsed}" aria-label="${collapsed?'Expand':'Collapse'} Hardware">Hardware</button>${collapsed?'':['Interface specification.pdf','Power review.md'].map((title,i)=>(state.closed[id]||[]).includes(i)?'':`<div class="sz-browser-tab ${selected===i?'selected':''}"><button class="sz-tab" data-option="${id}" data-index="${i}" aria-current="${selected===i?'page':'false'}"><span>${title}</span></button><button class="sz-tab-close" data-close="${id}" data-index="${i}" aria-label="Close ${title}">${icon('x')}</button></div>`).join('')}</div><div class="sz-browser-group is-collapsed" data-color="general"><span class="sz-group-label">General</span></div></div></header><div class="sz-preview-tools">${icon('panel-left')}<span class="sample-page">1 / 20</span><span>Fit width</span></div></div>`;
  });if(window.lucide)lucide.createIcons({attrs:{width:16,height:16}});}
  function save(){window.openai?.setWidgetState({modelContent:null,privateContent:state}).catch(()=>{});}
  root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.option){state.selected[b.dataset.option]=Number(b.dataset.index);}if(b.dataset.group){const id=b.dataset.group;state.collapsed[id]=!state.collapsed[id];if((state.closed[id]||[]).length===2)state.closed[id]=[];}if(b.dataset.close){const id=b.dataset.close,i=Number(b.dataset.index);state.closed[id]=[...(state.closed[id]||[]),i];state.selected[id]=i===0?1:0;if(state.closed[id].length===2)state.collapsed[id]=true;}draw();save();});
  window.addEventListener('openai:set_globals',e=>{const v=e.detail?.globals?.widgetState?.privateContent;if(v){Object.assign(state,v);draw();}});
  draw();
})();
</script>
