<?xml version="1.0" encoding="UTF-8"?>
<!-- A hand-written stand-in for what a diagram emitter would produce: two node
     shapes, a routed connector with an arrowhead, a diamond, and three text
     labels. md_svg_text_test asks whether those labels reach the page as text. -->
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="220" viewBox="0 0 420 220">
  <rect x="20" y="20" width="140" height="52" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
  <text x="90" y="52" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1F2328">Zanzibarnode</text>
  <rect x="260" y="20" width="140" height="52" rx="26" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1"/>
  <text x="330" y="52" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1F2328">Quetzalbox</text>
  <polyline points="160,46 260,46" fill="none" stroke="#59636E" stroke-width="1.2"/>
  <polygon points="260,46 251,42 251,50" fill="#59636E" stroke="#59636E"/>
  <polygon points="210,120 260,160 210,200 160,160" fill="#F6F8FA" stroke="#D0D7DE"/>
  <text x="210" y="165" font-family="sans-serif" font-size="13" text-anchor="middle" fill="#1F2328">Kumquatlabel</text>
  <polyline points="90,72 90,160 160,160" fill="none" stroke="#59636E" stroke-width="1.2"/>
</svg>
