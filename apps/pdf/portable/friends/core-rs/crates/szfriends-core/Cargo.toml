[package]
name = "szfriends-core"
description = "Shenzhen Friends service in Rust: the helper's areas for Windows, Linux, Android and iOS hosts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# BLAKE3 without its C and assembly (Rust intrinsics on x86, portable code on Arm): for checking a target from a
# machine without that target's C toolchain (the MSVC targets on a Mac, friends-core-rs-cross-check). Release builds
# leave it off: they compile BLAKE3's C where they compile SQLite's.
blake3-pure = ["blake3/pure"]

[dependencies]
szfriends-wire.workspace = true
szfriends-crypto.workspace = true
szfriends-identity.workspace = true
szfriends-contract.workspace = true
zeroize.workspace = true
blake2.workspace = true
blake3.workspace = true
zstd.workspace = true
sha2.workspace = true
unicode-normalization.workspace = true
serde_json.workspace = true
hex.workspace = true

[target.'cfg(not(target_os = "ios"))'.dependencies]
rusqlite = { workspace = true, features = ["bundled"] }

[target.'cfg(target_os = "ios")'.dependencies]
rusqlite = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "time", "fs", "process"] }

[dev-dependencies]
hex.workspace = true
szfriends-vectors.workspace = true
rusqlite.workspace = true

[lints]
workspace = true
