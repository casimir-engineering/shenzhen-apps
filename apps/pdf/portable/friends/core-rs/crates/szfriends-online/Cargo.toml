[package]
name = "szfriends-online"
description = "Shenzhen Friends online: host check-in and rendezvous, signalling, NAT techniques, the online order"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
szfriends-wire.workspace = true
szfriends-crypto.workspace = true
szfriends-identity.workspace = true
szfriends-datachannel-sys = { path = "../szfriends-datachannel-sys" }
sha2.workspace = true
hmac.workspace = true
zeroize.workspace = true
serde_json.workspace = true
# The rendezvous record's seal (XChaCha20-Poly1305, as libsodium's) and the download links' (AES-256-GCM, what
# WebCrypto gives a browser). chacha20poly1305 is the one snow already brings.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
# STUN's MESSAGE-INTEGRITY and the TURN REST credential (HMAC-SHA1), and the WebSocket accept key.
sha1 = { version = "0.10", default-features = false }

[dev-dependencies]
hex.workspace = true

[lints]
workspace = true
