# Shenzhen Friends portable core: the Rust implementation of the wire protocols and the view contract that the
# Objective-C helper (portable/friends/service) speaks, for Windows, Linux, Android and iOS hosts. ADR 0015
# (docs/adr/0015-portable-core.md) is the decision; portable/docs/plans/friends-portable-core.md the plan.
#
# Golden vectors exported from the Objective-C helper live in portable/friends/fixtures/vectors/; every crate's
# tests read them, so the two implementations cannot drift apart unnoticed (core-rs.mk: friends-vectors-check,
# friends-core-rs-check).

[workspace]
resolver = "2"
members = ["crates/*", "tools/embedded-size", "tools/nat-peer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
szfriends-wire = { path = "crates/szfriends-wire" }
szfriends-crypto = { path = "crates/szfriends-crypto" }
szfriends-identity = { path = "crates/szfriends-identity" }
szfriends-contract = { path = "crates/szfriends-contract" }
szfriends-core = { path = "crates/szfriends-core" }
szfriends-vectors = { path = "crates/szfriends-vectors" }

# One curve25519-dalek for snow, CPace and the identity keys (snow 0.10 pins the 4.x line). Not snow's "std": in 0.10
# it enables ring, a second crypto library with its own C and assembly build for every target.
snow = { version = "0.10", default-features = false, features = [
    "default-resolver", "use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom",
] }
curve25519-dalek = { version = "4.1.3", default-features = false, features = [
    "alloc", "zeroize", "precomputed-tables",
] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "zeroize"] }
blake2 = "0.10"
# ADR 0018 § 2: the fast-transfer tree. Pinned; the decision and its measurements are in the fast-transfers journal.
blake3 = "=1.8.5"
sha2 = "0.10"
hmac = "0.12"
subtle = "2.6"
zeroize = "1.8"
getrandom = "0.3"
unicode-normalization = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
# ADR 0015 § 7: SQLite bundled on Windows, Linux and Android (FTS5 with trigram everywhere), the system library on iOS.
rusqlite = { version = "0.40", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
# The ciphers' arm64 backends (.cargo/config.toml, phone.toml), which tests/build_flags.rs checks.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(chacha20_force_neon)", "cfg(aes_armv8)", "cfg(polyval_armv8)"] }
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Tests replay every byte of the helper's sessions through real cryptography: optimise the dependencies (curves,
# ciphers, SQLite) even in debug builds, so the suites stay quick in the VMs and simulators.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

# The ciphers and hashes that carry every transferred byte (ADR 0018 § 9.2): full speed, 1.7 times a size-optimised
# build's through a session's transport (examples/transport-speed in szfriends-crypto). snow, szfriends-crypto and the
# generic crates are listed too, because a generic cipher's code is generated in the crate that instantiates it. The
# phone profile inherits these. Their SIMD backends on arm64 are switched on in .cargo/config.toml and phone.toml.
[profile.release.package.szfriends-crypto]
opt-level = 3
[profile.release.package.snow]
opt-level = 3
[profile.release.package.chacha20poly1305]
opt-level = 3
[profile.release.package.chacha20]
opt-level = 3
[profile.release.package.poly1305]
opt-level = 3
[profile.release.package.aead]
opt-level = 3
[profile.release.package.cipher]
opt-level = 3
[profile.release.package.universal-hash]
opt-level = 3
[profile.release.package.aes-gcm]
opt-level = 3
[profile.release.package.aes]
opt-level = 3
[profile.release.package.ctr]
opt-level = 3
[profile.release.package.ghash]
opt-level = 3
[profile.release.package.polyval]
opt-level = 3
[profile.release.package.blake2]
opt-level = 3

# Phones (ADR 0015 § 12's 5 MB): the release profile made smaller, at the cost of speed a phone's radio never misses;
# the ciphers above keep their opt-level 3.
# An app embedding the core sets the same in its own release profile for its phone builds (tools/embedded-size.sh
# measures with it); szfriends-datachannel-sys compiles its C and C++ at -Oz on phones by itself.
[profile.phone]
inherits = "release"
opt-level = "z"
lto = "fat"
